
name: SmartDocs AI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q api.py worker.py main.py requeue_pending.py test_s3.py

  docker-build:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/sharjeelcodex/smartdocs-ai:latest

  deploy:
    name: Deploy to AWS EC2 and Verify Health
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate with AWS using GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail

          echo "Requesting GitHub OIDC token..."

          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: GitHub did not provide an OIDC token."
            exit 1
          fi

          export TOKEN

          echo "===== GitHub OIDC token claims ====="

          python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          header, payload = token.split(".")[:2]

          def decode(value):
              value += "=" * (-len(value) % 4)
              return json.loads(base64.urlsafe_b64decode(value))

          h = decode(header)
          c = decode(payload)

          print("JWT algorithm:", h.get("alg"))
          print("JWT key ID:", h.get("kid"))

          for key in ["iss", "aud", "sub", "repository_id", "repository_owner_id", "ref"]:
              print(f"{key}: {c.get(key)}")
          PY

          echo "===== Calling AWS STS directly ====="

          aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::556957333669:role/GitHubSmartDocsDeployRole" \
            --role-session-name "SmartDocsGitHubActions" \
            --web-identity-token "$TOKEN" \
            --duration-seconds 3600 \
            --output json > /tmp/aws-credentials.json

          echo "AWS STS authentication successful."

          echo "AWS_ACCESS_KEY_ID=$(jq -r '.Credentials.AccessKeyId' /tmp/aws-credentials.json)" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(jq -r '.Credentials.SecretAccessKey' /tmp/aws-credentials.json)" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' /tmp/aws-credentials.json)" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=eu-north-1" >> "$GITHUB_ENV"
          echo "AWS_REGION=eu-north-1" >> "$GITHUB_ENV"

          rm -f /tmp/aws-credentials.json

          echo "===== Verifying assumed AWS identity ====="

          aws sts get-caller-identity

      - name: Deploy application through AWS Systems Manager
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_COMMAND='cd /home/ubuntu/smartdocs-ai && sudo docker compose pull && sudo docker compose up -d --no-build --force-recreate api worker && for i in $(seq 1 30); do if curl -fsS -o /dev/null http://127.0.0.1:8000/app && sudo docker inspect -f "{{.State.Running}}" smartdocs-worker | grep -qx true; then echo DEPLOYMENT_HEALTHY; exit 0; fi; sleep 5; done; echo DEPLOYMENT_HEALTH_CHECK_FAILED; sudo docker compose ps; sudo docker compose logs --tail=50 api worker; exit 1'

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "i-03d369332ab536993" \
            --parameters "commands=$DEPLOY_COMMAND" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM deployment command: $COMMAND_ID"

      - name: Wait for deployment and health verification
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"
          INSTANCE_ID="i-03d369332ab536993"
          STATUS="Pending"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "{Output:StandardOutputContent,Error:StandardErrorContent}" \
                --output json
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --output json || true
              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out waiting for SSM."
          exit 1
