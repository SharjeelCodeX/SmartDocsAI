
name: SmartDocs AI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q api.py worker.py main.py requeue_pending.py test_s3.py

  docker-build:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/sharjeelcodex/smartdocs-ai:latest

  deploy:
    name: Deploy to AWS EC2 and Verify Health
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate with AWS using GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail

          echo "===== STEP 1: Request GitHub OIDC token ====="

          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: GitHub OIDC token unavailable."
            exit 1
          fi

          export TOKEN

          echo "===== STEP 2: Verify token claims ====="

          python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          header, payload = token.split(".")[:2]

          def decode(value):
              value += "=" * (-len(value) % 4)
              return json.loads(base64.urlsafe_b64decode(value))

          h = decode(header)
          c = decode(payload)

          print("Algorithm:", h.get("alg"))
          print("Signing key ID:", h.get("kid"))

          for key in ["iss", "aud", "sub", "repository_id",
                      "repository_owner_id", "ref", "exp", "iat"]:
              print(f"{key}: {c.get(key)}")

          if c.get("iss") != "https://token.actions.githubusercontent.com":
              raise SystemExit("ERROR: Unexpected OIDC issuer.")

          if c.get("aud") != "sts.amazonaws.com":
              raise SystemExit("ERROR: Unexpected OIDC audience.")

          if h.get("alg") != "RS256":
              raise SystemExit("ERROR: Unexpected signing algorithm.")

          PY

          echo "===== STEP 3: Check GitHub OIDC discovery ====="

          curl -fsS \
            https://token.actions.githubusercontent.com/.well-known/openid-configuration \
            -o /tmp/oidc-discovery.json

          python - <<'PY'
          import json

          with open("/tmp/oidc-discovery.json") as f:
              data = json.load(f)

          print("Issuer:", data.get("issuer"))
          print("JWKS URI:", data.get("jwks_uri"))
          print("Supported algorithms:", data.get("id_token_signing_alg_values_supported"))

          if data.get("issuer") != "https://token.actions.githubusercontent.com":
              raise SystemExit("ERROR: Discovery issuer mismatch.")
          PY

          echo "===== STEP 4: Verify signing key in GitHub JWKS ====="

          JWKS_URI=$(python -c \
            'import json; print(json.load(open("/tmp/oidc-discovery.json"))["jwks_uri"])')

          TOKEN_KID=$(python -c \
            'import os,json,base64; p=os.environ["TOKEN"].split(".")[0]; p+="="*(-len(p)%4); print(json.loads(base64.urlsafe_b64decode(p))["kid"])')

          echo "Token signing key ID: $TOKEN_KID"
          echo "JWKS URI: $JWKS_URI"

          curl -fsS -D /tmp/jwks-headers "$JWKS_URI" -o /tmp/jwks.json

          echo "JWKS response headers:"
          grep -iE 'HTTP/|cache-control|content-type' /tmp/jwks-headers || true

          python - <<'PY'
          import json
          import os

          kid = os.environ["TOKEN_KID"]

          with open("/tmp/jwks.json") as f:
              data = json.load(f)

          keys = data.get("keys", [])
          matches = [key for key in keys if key.get("kid") == kid]

          print("Total signing keys:", len(keys))
          print("Matching signing keys:", len(matches))

          for key in matches:
              print({
                  "kid": key.get("kid"),
                  "kty": key.get("kty"),
                  "alg": key.get("alg"),
                  "use": key.get("use")
              })

          if len(matches) != 1:
              raise SystemExit(
                  "ERROR: JWT signing key is missing or duplicated in GitHub JWKS."
              )
          PY

          echo "===== STEP 5: Inspect GitHub TLS certificate chain ====="

          mkdir -p /tmp/oidc-certs

          openssl s_client \
            -servername token.actions.githubusercontent.com \
            -showcerts \
            -connect token.actions.githubusercontent.com:443 \
            </dev/null > /tmp/oidc-tls.txt 2>&1

          grep -E 'Verify return code|Verification:' /tmp/oidc-tls.txt || true

          awk '
          /-----BEGIN CERTIFICATE-----/ {
              n++
              file=sprintf("/tmp/oidc-certs/cert-%02d.pem", n)
          }
          file { print > file }
          /-----END CERTIFICATE-----/ {
              close(file)
              file=""
          }
          ' /tmp/oidc-tls.txt

          for CERT in /tmp/oidc-certs/*.pem; do
            echo "Certificate: $CERT"
            openssl x509 -in "$CERT" -noout \
              -subject -issuer -fingerprint -sha1
          done

          echo "===== STEP 6: Request AWS STS authentication ====="

          aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::556957333669:role/GitHubSmartDocsDeployRole" \
            --role-session-name "SmartDocsGitHubActions" \
            --web-identity-token "$TOKEN" \
            --duration-seconds 3600 \
            --region eu-north-1 \
            --output json > /tmp/aws-credentials.json

          echo "AWS STS authentication successful."

          echo "===== STEP 7: Export temporary AWS credentials ====="

          ACCESS_KEY=$(jq -r '.Credentials.AccessKeyId' /tmp/aws-credentials.json)
          SECRET_KEY=$(jq -r '.Credentials.SecretAccessKey' /tmp/aws-credentials.json)
          SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' /tmp/aws-credentials.json)

          echo "::add-mask::$ACCESS_KEY"
          echo "::add-mask::$SECRET_KEY"
          echo "::add-mask::$SESSION_TOKEN"

          {
            echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY"
            echo "AWS_SECRET_ACCESS_KEY=$SECRET_KEY"
            echo "AWS_SESSION_TOKEN=$SESSION_TOKEN"
            echo "AWS_DEFAULT_REGION=eu-north-1"
            echo "AWS_REGION=eu-north-1"
          } >> "$GITHUB_ENV"

          rm -f /tmp/aws-credentials.json

          unset TOKEN ACCESS_KEY SECRET_KEY SESSION_TOKEN

          echo "===== STEP 8: Verify AWS identity ====="

          aws sts get-caller-identity

      - name: Deploy application through AWS Systems Manager
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_COMMAND='cd /home/ubuntu/smartdocs-ai && sudo docker compose pull && sudo docker compose up -d --no-build --force-recreate api worker && for i in $(seq 1 30); do if curl -fsS -o /dev/null http://127.0.0.1:8000/app && sudo docker inspect -f "{{.State.Running}}" smartdocs-worker | grep -qx true; then echo DEPLOYMENT_HEALTHY; exit 0; fi; sleep 5; done; echo DEPLOYMENT_HEALTH_CHECK_FAILED; sudo docker compose ps; sudo docker compose logs --tail=50 api worker; exit 1'

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "i-03d369332ab536993" \
            --parameters "commands=$DEPLOY_COMMAND" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM deployment command: $COMMAND_ID"

      - name: Wait for deployment and health verification
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"
          INSTANCE_ID="i-03d369332ab536993"
          STATUS="Pending"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "{Output:StandardOutputContent,Error:StandardErrorContent}" \
                --output json
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --output json || true
              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out waiting for SSM."
          exit 1
