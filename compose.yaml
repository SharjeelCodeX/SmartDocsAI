services:
  api:
    build: .
    container_name: smartdocs-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      AWS_DEFAULT_REGION: eu-north-1
      AWS_REGION: eu-north-1
      SQS_QUEUE_URL: https://sqs.eu-north-1.amazonaws.com/556957333669/smartdocs-ai-processing
      S3_BUCKET: smartdocs-ai-documents-2026-unique123
    volumes:
      - .:/app
    restart: unless-stopped

  worker:
    build: .
    container_name: smartdocs-worker
    command: python worker.py
    environment:
      AWS_DEFAULT_REGION: eu-north-1
      AWS_REGION: eu-north-1
      SQS_QUEUE_URL: https://sqs.eu-north-1.amazonaws.com/556957333669/smartdocs-ai-processing
      S3_BUCKET: smartdocs-ai-documents-2026-unique123
    volumes:
      - .:/app
    restart: unless-stopped